<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Việt Nam</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="bai11.css">
</head>
<body>
    <div class="gallery-container">
        <header class="gallery-header">
            <h1>Thư viện ảnh Việt Nam</h1>
            <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
        </header>
        <div class="gallery-grid">
            <figure class="gallery-item">
                <img src="ha-long.jpg" alt="Vịnh Hạ Long">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="son-doong.jpg" alt="Hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="ban-gioc.jpg" alt="Thác Bản Giốc">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="fansipan.jpg" alt="Fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="cuu-long.jpg" alt="Đồng bằng sông Cửu Long">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="phong-nha.jpg" alt="Động Phong Nha">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>

        </div>
    </div>

</body>
</html>
